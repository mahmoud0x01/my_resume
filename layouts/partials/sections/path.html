{{/* The Path — distinctive interactive graph */}}
<section id="path" class="recruiter-section recruiter-path" aria-labelledby="capability-map-title">
    <div class="recruiter-container">
        <div class="hero-graph-intro" aria-labelledby="capability-map-title">
            <div>
                <p class="hero-section-kicker">The path</p>
                <h2 id="capability-map-title">EVERYTHING ABOUT ME</h2>
            </div>
        </div>
    </div>

    <div class="graph-view-controls" role="group" aria-label="Capability map view mode">
        <span class="graph-view-controls-label">View</span>
        <button id="graph-list-toggle" class="graph-view-btn" type="button" aria-controls="portfolio-constellation portfolio-list-view" aria-pressed="false" aria-label="Toggle capability map view">Switch to List View</button>
    </div>

    <div class="constellation-wrap" role="region" aria-labelledby="capability-map-title">
            <div id="portfolio-constellation"></div>
            <!-- Legend dot colors are theme-aware --lg-* tokens defined in portfolio-graph.css -->
            <div class="constellation-legend" role="list" aria-label="Capability map legend">
                <span class="constellation-legend-item" role="listitem"><span class="constellation-legend-dot" style="--dot:var(--lg-pentesting)" aria-hidden="true"></span> Pentesting</span>
                <span class="constellation-legend-item" role="listitem"><span class="constellation-legend-dot" style="--dot:var(--lg-networking)" aria-hidden="true"></span> Networking</span>
                <span class="constellation-legend-item" role="listitem"><span class="constellation-legend-dot" style="--dot:var(--lg-sysadmin)" aria-hidden="true"></span> Sysadmin</span>
                <span class="constellation-legend-item" role="listitem"><span class="constellation-legend-dot" style="--dot:var(--lg-tools)" aria-hidden="true"></span> Tools</span>
                <span class="constellation-legend-item" role="listitem"><span class="constellation-legend-dot" style="--dot:var(--lg-scripting)" aria-hidden="true"></span> Scripting</span>
                <span class="constellation-legend-item" role="listitem"><span class="constellation-legend-dot" style="--dot:var(--lg-projects)" aria-hidden="true"></span> Projects</span>
                <span class="constellation-legend-item" role="listitem"><span class="constellation-legend-dot" style="--dot:var(--lg-concepts)" aria-hidden="true"></span> Concepts</span>
                <span class="constellation-legend-item" role="listitem"><span class="constellation-legend-dot" style="--dot:var(--lg-awards)" aria-hidden="true"></span> Awards</span>
                <span class="constellation-legend-item" role="listitem"><span class="constellation-legend-dot" style="--dot:var(--lg-experience)" aria-hidden="true"></span> Experience</span>
                <span class="constellation-legend-item" role="listitem"><span class="constellation-legend-dot" style="--dot:var(--lg-education)" aria-hidden="true"></span> Education</span>
                <span class="constellation-legend-item" role="listitem"><span class="constellation-legend-dot" style="--dot:var(--lg-courses)" aria-hidden="true"></span> Courses</span>
                <span class="constellation-legend-item" role="listitem"><span class="constellation-legend-dot" style="--dot:var(--lg-certificates)" aria-hidden="true"></span> Certificates</span>
                <span class="constellation-legend-item" role="listitem"><span class="constellation-legend-dot" style="--dot:var(--lg-blogs)" aria-hidden="true"></span> Blogs</span>
            </div>
        </div>

    <!-- LIST VIEW (Escape Hatch) — grouped, recruiter-friendly layout -->
    <div id="portfolio-list-view" class="portfolio-list-view" aria-label="Capability map list view"></div>

</section>
