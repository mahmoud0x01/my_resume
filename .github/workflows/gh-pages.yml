name: Deploy Hugo site to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: 'latest'
          extended: true

      - name: Clean build artifacts
        run: |
          rm -rf public
          rm -rf resources/_gen
          rm -rf .hugo_build.lock

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          rm -rf public
          rm -rf resources/_gen

          BASE_URL="${{ steps.pages.outputs.base_url }}/"
          BASE_PATH="$(python3 - <<'PY'
from urllib.parse import urlparse
url = "${{ steps.pages.outputs.base_url }}/"
print(urlparse(url).path.rstrip("/"))
PY
)"
          export BASE_PATH
          export HUGO_PARAMS_STATICPATH="$BASE_PATH"

          hugo \
            --gc \
            --minify \
            --cleanDestinationDir \
            --baseURL "$BASE_URL"

          rm -f public/CNAME

          python3 - <<'PY'
import os
import re
from pathlib import Path

base = os.environ.get("BASE_PATH", "").rstrip("/")
if base:
    asset_re = re.compile(
        r'(?P<attr>\b(?:src|href)=)(?P<quote>["\']?)/(?P<path>(?:js|images|css|bootstrap-5|fontawesome-6)/[^"\' >]+|fav\.png|404\.png)'
    )
    for page in Path("public").rglob("*.html"):
        text = page.read_text(encoding="utf-8")
        text = asset_re.sub(
            lambda m: f'{m.group("attr")}{m.group("quote")}{base}/{m.group("path")}',
            text,
        )
        page.write_text(text, encoding="utf-8")
PY

      - name: Verify build content
        run: |
          echo "Checking built content..."
          ls -la public/ || echo "Public directory not found!"
          echo "Blog posts in public:"
          ls public/blogs/ || echo "No blogs directory"
          test ! -f public/CNAME
          test -f public/index.html
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
