name: Deploy Hugo site to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: 'latest'
          extended: true

      - name: Clean build artifacts
        run: |
          rm -rf public
          rm -rf resources/_gen
          rm -rf .hugo_build.lock

      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          rm -rf public
          rm -rf resources/_gen

          export BASE_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          BASE_PATH="$(python3 -c 'import os; from urllib.parse import urlparse; print(urlparse(os.environ["BASE_URL"]).path.rstrip("/"))')"
          export BASE_PATH
          export HUGO_PARAMS_STATICPATH="$BASE_PATH"

          hugo \
            --gc \
            --minify \
            --cleanDestinationDir \
            --baseURL "$BASE_URL"

          rm -f public/CNAME

          python3 .github/scripts/fix-pages-paths.py

      - name: Verify build content
        run: |
          echo "Checking built content..."
          ls -la public/ || echo "Public directory not found!"
          echo "Blog posts in public:"
          ls public/blogs/ || echo "No blogs directory"
          test ! -f public/CNAME
          test -f public/index.html

      - name: Publish gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd public
          touch .nojekyll
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Deploy GitHub Pages"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
