name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

# Set minimal permissions for security
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: 'latest'
          extended: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Determine baseURL
        id: baseurl
        run: |
          # Try to extract baseURL from hugo.yaml first
          if grep -q "^baseURL:" hugo.yaml; then
            # Extract baseURL: get the line, remove baseURL: prefix, remove quotes, trim whitespace and control chars
            BASE_URL=$(grep "^baseURL:" hugo.yaml | sed -E 's/^baseURL:[[:space:]]*"([^"]+)"[[:space:]]*$/\1/' | sed -E 's/^baseURL:[[:space:]]*([^[:space:]]+)[[:space:]]*$/\1/' | tr -d '\r\n\t ')
            # Remove trailing slash if present, then add one
            BASE_URL="${BASE_URL%/}/"
            echo "Using baseURL from hugo.yaml: '${BASE_URL}'"
          elif [ -f "static/CNAME" ]; then
            # Fallback: Check if CNAME exists (custom domain)
            DOMAIN=$(cat static/CNAME | tr -d '[:space:\r\n\t]')
            BASE_URL="https://${DOMAIN%/}/"
            echo "Using baseURL from CNAME: '${BASE_URL}'"
          else
            # Fallback: Use Pages URL
            BASE_URL="${{ steps.pages.outputs.base_url }}"
            BASE_URL="${BASE_URL%/}/"
            echo "Using baseURL from Pages: '${BASE_URL}'"
          fi
          # Clean any remaining control characters
          BASE_URL=$(printf '%s' "$BASE_URL" | tr -d '\r\n\t')
          # Verify the URL is not empty
          if [ -z "$BASE_URL" ]; then
            echo "Error: baseURL is empty!"
            exit 1
          fi
          echo "Final baseURL: '${BASE_URL}'"
          echo "base_url=${BASE_URL}" >> $GITHUB_OUTPUT

      - name: Verify theme
        run: |
          if [ ! -d "themes/hugo-profile" ]; then
            echo "Error: Theme not found!"
            exit 1
          fi
          echo "Theme found at: themes/hugo-profile"
          ls -la themes/hugo-profile/static/js/ | head -10

      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENABLEGITINFO: true
        run: |
          echo "Building with baseURL: ${{ steps.baseurl.outputs.base_url }}"
          hugo \
            --gc \
            --minify \
            --cleanDestinationDir \
            --baseURL "${{ steps.baseurl.outputs.base_url }}"
          
          # Verify build output
          echo "Build completed. Checking public directory:"
          ls -la public/ | head -10
          if [ -f "public/index.html" ]; then
            echo "✓ index.html exists"
            # Check if JS files are present
            if [ -f "public/js/typingEffect.js" ]; then
              echo "✓ typingEffect.js exists"
            else
              echo "✗ typingEffect.js NOT found!"
            fi
          else
            echo "✗ index.html NOT found!"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

