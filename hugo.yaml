  # projects
  projects:
    enable: true
    title: "Selected Projects"
    items:
      - title: "ELK SOC Home Lab — Detection Engineering"
        content: "Home SOC lab: Dockerized ELK 8.12 (Filebeat → Logstash → Elasticsearch → Kibana) ingesting 50k+ Linux audit/syslog events; 5 Sigma rules MITRE-mapped (T1548.003, T1110.001, T1053.003…), tuned noisy sudo rule 180→12/day, Kibana dashboards for auth failures & alert triage with documented MTTD reduction."
        securityAngle: "SIEM design, Sigma detection engineering, log parsing (grok) and alert triage workflow — SOC core."
        image: /images/elk-siem-lab.png
        featured: true
        badges: ["ELK Stack", "Filebeat", "Logstash", "Elasticsearch", "Kibana", "Sigma", "MITRE ATT&CK", "Auditd"]
        links:
          - icon: fab fa-github
            url: https://github.com/mahmoud0x01
        github: https://github.com/mahmoud0x01

      - title: "IR Lab — Windows Malware Triage & Forensics"
        content: "Controlled IR simulation: intentionally executed lab malware simulator on isolated Windows 10 VM (host-only, snapshot); traced persistence via Sysmon (ID 1/3/13), netstat + Autoruns, contained via firewall block & taskkill, eradicated Run-key + scheduled task, preserved evidence with KAPE and delivered 1-page executive report."
        securityAngle: "Incident response lifecycle: identification → containment → eradication → recovery with MITRE mapping (T1059.001, T1105…)."
        image: /images/ir-malware-triage-lab.png
        featured: true
        badges: ["Incident Response", "Sysmon", "Wireshark", "Volatility", "KAPE", "Windows Security", "MITRE ATT&CK"]
        links:
          - icon: fab fa-github
            url: https://github.com/mahmoud0x01
        github: https://github.com/mahmoud0x01

      - title: TicketPro - Full Stack Support Ticket Management System
        content: Developed a full-stack support ticket management system with real-time features, ticket tracking, and role-based access control. Features include user authentication with different roles, complete ticket lifecycle management (Open/In Progress/Resolved/Closed), real-time chat between users and support staff, ticket prioritization (Low, Medium, High, Urgent), notification system for ticket status updates, analytics dashboard with performance metrics, SLA compliance monitoring and automatic escalation.
        securityAngle: "RBAC and authentication clarify role boundaries and ticket authorization paths."
        image: /images/projects/profile.png
        featured: true
        badges:
          - "Python"
          - "Django"
          - "Django REST Framework"
          - "WebSockets"
          - "PostgreSQL"
          - "Tailwind CSS"
        links:
          - icon: fab fa-github
            url: https://github.com/mahmoud0x01/Ticket_Support_full_stack

      - title: CollabEditor — Real-Time Collaborative Document Editor (Thesis)
        content: "Graduation thesis (Sep 2025 – Jan 2026) — Google Docs–grade platform turning “send me the file” into “join the document.” Builds live document management and teamwork (Classes/Posts/Comments, dashboard, share-links) on Django 5.2 + Channels/Redis/PostgreSQL + React/Quill. Core challenge: conflict-free sync via Decimal-ordered CRDT sequence + Lamport clock (`DOC_STATES`, `prec=28`) with in-document scoped permissions (`edit_ranges` line-col anchors, server-side redaction █)."
        securityAngle: "In-document scoped ACL (owner / full / partial / viewer) with line-col anchored edit_ranges, instant redaction █ and dual read/write enforcement; JWT for REST and ?token= WebSocket handshake, revocable Document/Class share-links."
        image: /images/projects/profile.png
        featured: true
        badges:
          - "Django"
          - "Django Channels"
          - "WebSockets"
          - "PostgreSQL"
          - "Redis"
          - "React"
          - "Quill 2.0"
          - "CRDT"
        links:
          - icon: fab fa-github
            url: https://github.com/mahmoud0x01/collabeditor

      - title: "AWS IAM Misconfig Lab — ScoutSuite & Prowler"
        content: "Lab AWS account reproducing 5 IAM misconfigs (wildcard *:*, trust Principal: *, PassRole privesc) found as bug-bounty patterns; validated with ScoutSuite/Prowler + SimulatePrincipalPolicy and hardened via least privilege, conditions, Boundaries & Access Analyzer."
        securityAngle: "Cloud security: IAM trust policies, least privilege and privesc path analysis."
        image: /images/aws-iam-lab.png
        featured: false
        badges: ["AWS IAM", "ScoutSuite", "Prowler", "CloudTrail", "GuardDuty"]
        links:
          - icon: fab fa-github
            url: https://github.com/mahmoud0x01
        github: https://github.com/mahmoud0x01

      - title: Full Stack Restaurant Delivery Web Application
        content: Developed a full-stack API project for an online restaurant delivery service with complete authentication system, dish management, shopping cart, and ratings. Features include user authentication, dish management, shopping cart functionality, order processing, rating system, security features, and settings configuration. Full API endpoints documentation available via OpenAPI/Swagger.
        securityAngle: "Authentication, API endpoints, and OpenAPI documentation support API validation."
        image: /images/projects/converter.jpg
        featured: false
        badges:
          - "C#"
          - ".NET"
          - "PostgreSQL"
          - "JavaScript"
          - "HTML/CSS"
        links:
          - icon: fab fa-github
            url: https://github.com/mahmoud0x01/restaurant_website

      - title: CashFlow - Financial Management System
        content: Developed a Django web application for managing cash flow records with support for statuses, types, categories, and subcategories. Features include adding and editing income and expense records, assigning statuses (e.g., "pending", "completed"), classifying records by type (income/expense), managing categories and subcategories for organizing records, viewing overall cash flow statistics, filtering and searching by various parameters, admin interface for data management, and superuser creation capability.
        securityAngle: "Django admin and superuser workflows provide authorization test cases."
        image: /images/projects/profile2.jpg
        featured: false
        badges:
          - "Python"
          - "Django"
          - "SQLite3"
          - "Bootstrap"
        links:
          - icon: fab fa-github
            url: https://github.com/mahmoud0x01/finance_management_system

      - title: Telegram News Aggregation Bot
        content: Developed a Telegram bot that aggregates news from various sources and provides users with the ability to receive updates via subscription with flexible interval settings. Features include fetching news by command `/news <source>`, setting default source for quick access, subscribing to automatic news distribution with interval, managing subscriptions (unsubscribe, viewing active subscriptions), viewing available sources via `/listsources` command, storing user data and subscriptions in PostgreSQL database, and Docker Compose deployment.
        securityAngle: "Subscription access, PostgreSQL persistence, and Docker Compose deployment expose configuration concerns."
        image: /images/projects/profile.png
        featured: false
        badges:
          - "Python"
          - "aiogram"
          - "SQLAlchemy"
          - "PostgreSQL"
          - "Docker"
        links:
          - icon: fab fa-github
            url: https://github.com/mahmoud0x01/news_bot_telegram

      - title: Social Network Backend API
        content: Developed a RESTful API for a social network website using Python with FastAPI and SQLAlchemy. Features include user creation and login, posting and editing posts, adding and removing comments, authorization checks for protected actions, secure password storage, and business-logic safeguards such as preventing duplicate likes.
        securityAngle: "Authentication, authorization, password storage, and API error handling are explicit implementation concerns."
        image: /images/projects/converter.jpg
        featured: false
        badges:
          - "Python"
          - "FastAPI"
          - "SQLAlchemy"
        links:
          - icon: fab fa-github
            url: https://github.com/mahmoud0x01/myrestful

      - title: Automated Cryptocurrency Trading Bot with Telegram Support
        content: Developed a cryptocurrency trading bot supporting automatic and manual trading of multiple assets via Telegram commands. Features include receiving trading signals from TradingView via Mailgun, automatic order execution through Bybit API, stop-loss and take-profit support, bot management through Telegram (start, pause, stop), trading statistics tracking (realized/unrealized profit, fees), ability to run multiple bot instances for different trading pairs, simulation mode for testing strategies without risk, and secure access by chat ID with ability to add new authorized users.
        securityAngle: "Chat-ID authorization and external API integrations provide access-control validation points."
        image: /images/projects/profile2.jpg
        featured: false
        badges:
          - "Python"
          - "Bybit API"
          - "Mailgun API"
          - "Telegram Bot API"
        links:
          - icon: fab fa-github
            url: https://github.com/mahmoud0x01/Crypto_bot_telegram

