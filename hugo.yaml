  # About
  about:
    enable: true
    title: "About Me"
    image: "/images/me-avatar.png"
    content: |-
      Software Engineer by degree, Offensive Security researcher by practice. I specialize in bridging application code quality with web/API penetration testing, threat modeling, and secure architecture. Experienced in identifying business-critical vulnerabilities (such as OAuth CSRF-to-ATO) and conducting authorized security assessments.

      Proof includes 20+ HoF Acknowledgments — including DigitalOcean, Pinterest, Verisign, and Dell through Bugcrowd — a Top 5 / 100 result in Bastion's internal penetration-testing and privilege-escalation CTF, two technical internships including one in penetration testing, and published security research.

      My Software Engineering degree at Tomsk State University strengthens system reasoning, architecture, documentation, and automation — from UML and component diagrams to full development lifecycles and tooling that makes findings reproducible.

      I test only within authorized scope and practice responsible disclosure. Familiar with OWASP ASVS, NIST CSF, ISO 27001, SANS Top 25, and GDPR-compliant security testing.
