  # About
  about:
    enable: true
    title: "About Me"
    image: "/images/me-avatar.png"
    content: |-
      I work across offensive testing and systems engineering. I assess how applications, networks, and operating systems behave — then validate what I find against how they are built and operated.

      Proof includes 20+ bug-bounty Hall of Fame recognitions — including DigitalOcean, Pinterest, Verisign, and Dell through Bugcrowd — a Top 5 / 100 result in Bastion's internal penetration-testing and privilege-escalation CTF, two technical internships including one in penetration testing, and published security research.

      My Software Engineering degree at Tomsk State University strengthens system reasoning, architecture, documentation, and automation — from UML and component diagrams to full development lifecycles and tooling that makes findings reproducible.

      I test only within authorized scope and practice responsible disclosure.
    proofPoints:
      - value: "+20"
        label: "Hall of Fame recognitions"
        detail: "Responsible disclosure"
      - value: "Top 5 / 100"
        label: "Bastion internal CTF"
        detail: "Penetration testing challenges"
