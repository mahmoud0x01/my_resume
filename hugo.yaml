  # projects
  projects:
    enable: false
    # title: "Custom Name"
    items:
      - title: TicketPro - Full Stack Support Ticket Management System
        content: Developed a full-stack support ticket management system with real-time features, ticket tracking, and role-based access control. Features include user authentication with different roles, complete ticket lifecycle management (Open/In Progress/Resolved/Closed), real-time chat between users and support staff, ticket prioritization (Low, Medium, High, Urgent), notification system for ticket status updates, analytics dashboard with performance metrics, SLA compliance monitoring and automatic escalation.
        image: /images/projects/profile.png
        badges:
          - "Python"
          - "Django"
          - "Django REST Framework"
          - "WebSockets"
          - "PostgreSQL"
          - "Tailwind CSS"
        links:
          - icon: fab fa-github
            url: https://github.com/mahmoud0x01/Ticket_Support_full_stack

      - title: Full Stack Restaurant Delivery Web Application
        content: Developed a full-stack API project for an online restaurant delivery service with complete authentication system, dish management, shopping cart, and ratings. Features include user authentication, dish management, shopping cart functionality, order processing, rating system, security features, and settings configuration. Full API endpoints documentation available via OpenAPI/Swagger.
        image: /images/projects/converter.jpg
        badges:
          - "C#"
          - ".NET"
          - "PostgreSQL"
          - "JavaScript"
          - "HTML/CSS"
        links:
          - icon: fab fa-github
            url: https://github.com/mahmoud0x01/restaurant_website

      - title: CashFlow - Financial Management System
        content: Developed a Django web application for managing cash flow records with support for statuses, types, categories, and subcategories. Features include adding and editing income and expense records, assigning statuses (e.g., "pending", "completed"), classifying records by type (income/expense), managing categories and subcategories for organizing records, viewing overall cash flow statistics, filtering and searching by various parameters, admin interface for data management, and superuser creation capability.
        image: /images/projects/profile2.jpg
        badges:
          - "Python"
          - "Django"
          - "SQLite3"
          - "Bootstrap"
        links:
          - icon: fab fa-github
            url: https://github.com/mahmoud0x01/finance_management_system

      - title: Telegram News Aggregation Bot
        content: Developed a Telegram bot that aggregates news from various sources and provides users with the ability to receive updates via subscription with flexible interval settings. Features include fetching news by command `/news <source>`, setting default source for quick access, subscribing to automatic news distribution with interval, managing subscriptions (unsubscribe, viewing active subscriptions), viewing available sources via `/listsources` command, storing user data and subscriptions in PostgreSQL database, and Docker Compose deployment.
        image: /images/projects/profile.png
        badges:
          - "Python"
          - "aiogram"
          - "SQLAlchemy"
          - "PostgreSQL"
          - "Docker"
        links:
          - icon: fab fa-github
            url: https://github.com/mahmoud0x01/news_bot_telegram

      - title: Social Network Backend API
        content: Developed a RESTful API for a social network website using Python with FastAPI and SQLAlchemy. Features include user creation and login, posting and editing posts, adding and removing comments, user authorization (editing posts, deleting comments), secure password storage in database, user data protection with authorization mechanism, data encryption to prevent leaks, and business logic error fixes (e.g., preventing double likes).
        image: /images/projects/converter.jpg
        badges:
          - "Python"
          - "FastAPI"
          - "SQLAlchemy"
        links:
          - icon: fab fa-github
            url: https://github.com/mahmoud0x01/myrestful

      - title: Automated Cryptocurrency Trading Bot with Telegram Support
        content: Developed a cryptocurrency trading bot supporting automatic and manual trading of multiple assets via Telegram commands. Features include receiving trading signals from TradingView via Mailgun, automatic order execution through Bybit API, stop-loss and take-profit support, bot management through Telegram (start, pause, stop), trading statistics tracking (realized/unrealized profit, fees), ability to run multiple bot instances for different trading pairs, simulation mode for testing strategies without risk, and secure access by chat ID with ability to add new authorized users.
        image: /images/projects/profile2.jpg
        badges:
          - "Python"
          - "Bybit API"
          - "Mailgun API"
          - "Telegram Bot API"
        links:
          - icon: fab fa-github
            url: https://github.com/mahmoud0x01/Crypto_bot_telegram

